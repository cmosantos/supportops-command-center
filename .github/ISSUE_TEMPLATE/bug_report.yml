name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, production incidents, internal URLs, or exploit details.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Docker Compose
        - Local Python / uv
        - Installed wheel
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction steps
      description: Use synthetic data and the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Sanitized logs, screenshots, exit codes, or test output. Remove paths and identifiers.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I used synthetic data and removed secrets, personal data, internal paths, and customer information.
          required: true
